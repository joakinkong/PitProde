# Render publica el backend. Los secretos NO están acá: se cargan en el panel (sync: false).
services:
  - type: web
    name: pitprode-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node backend/server.js
    healthCheckPath: /api/acceso
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: ORGANIZER_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
